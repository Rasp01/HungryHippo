<!DOCTYPE html>
<html>
<head>
  <title>My Recipe Website</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Recipe Website</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav" id="recipe-links">
        <!-- Recipe links will be added here -->
      </ul>
    </div>
  </nav>

  <div class="container-fluid mt-4">
    <div id="recipe-content">
      <h1>Welcome to My Recipe Website</h1>
      <iframe id="recipe-iframe" style="width: 100%; height: 80vh; border: none;"></iframe>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script>
    fetch('/get-recipes')
      .then(response => response.json())
      .then(recipes => {
        const recipeLinksContainer = document.getElementById('recipe-links');
        recipes.forEach(recipe => {
          const listItem = document.createElement('li');
          listItem.className = 'nav-item';
          const link = document.createElement('a');
          link.className = 'nav-link';
          link.textContent = recipe;
          link.href = '#';
          link.addEventListener('click', (event) => {
            event.preventDefault();
            document.getElementById('recipe-iframe').src = `/recipes/${recipe}`;
          });
          listItem.appendChild(link);
          recipeLinksContainer.appendChild(listItem);
        });
      });
  </script>
</body>
</html>
