<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HungryHippo</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    .fixed-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }
    /* Category-specific styles */
    .fruit-veg {
      color: green;
    }
    .dairy-deli {
      color: blue;
    }
    .bakery {
      color: orange;
    }
    .tinned-foods {
      color: purple;
    }
    .herbs-spices {
      color: brown;
    }
    .other {
      color: red;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">
      <img src="HHLogo.png" alt="HH Logo" style="height: 50px; width: auto; margin-right: 10px;">
      Hungary Hippo
    </a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav" id="recipe-links">
        <!-- Recipe links will be added here -->
        <!-- <li class="nav-item">
          <a class="nav-link" href="#" id="shopping-list-link">Shopping List</a>
        </li> -->
      </ul>
    </div>
  </nav>

  <div class="container-fluid mt-4">
    <div id="recipe-content" style="display: none;">
      <iframe id="recipe-iframe" style="width: 100%; height: 80vh; border: none;"></iframe>
    </div>
    <div id="shopping-list-content">
      <h1>Shopping List</h1>
      <pre id="shopping-list"></pre>
    </div>
  </div>

  <button class="btn btn-primary fixed-button" id="scrape-recipes-button">Reset Recipes</button>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <script src="recipeApp.js"></script>
</body>
</html>
